name: Deploy Edge Functions to VPS

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-vps-functions.yml'
  workflow_dispatch:

concurrency:
  group: vps-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_PATH }}"
            SUPA_DIR="${{ secrets.VPS_SUPABASE_PATH }}"
            [ -n "$APP_DIR" ] || { echo "VPS_APP_PATH secret is missing"; exit 1; }
            [ -n "$SUPA_DIR" ] || SUPA_DIR="$APP_DIR"

            echo "==> Pull latest code in $APP_DIR"
            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main

            echo "==> Restart edge functions container in $SUPA_DIR"
            cd "$SUPA_DIR"
            docker compose up -d --force-recreate functions

            echo "==> Wait for container to become healthy"
            for i in $(seq 1 20); do
              if docker compose ps functions | grep -qi 'up'; then
                echo "functions container is up"
                break
              fi
              sleep 3
            done

            docker compose logs --tail=30 functions || true
            echo "==> Deploy finished"
