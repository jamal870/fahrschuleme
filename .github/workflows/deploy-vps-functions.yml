name: Deploy Edge Functions to VPS

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-vps-functions.yml'
  workflow_dispatch:

concurrency:
  group: vps-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_PATH }}"
            SUPA_DIR="${{ secrets.VPS_SUPABASE_PATH }}"
            # Fallback: gaengige Pfade automatisch erkennen, falls kein Secret gesetzt ist
            if [ -z "$APP_DIR" ]; then
              for p in /opt/fahrschuleme /opt/supabase /root/fahrschuleme /opt/app; do
                if [ -d "$p/.git" ]; then APP_DIR="$p"; break; fi
              done
            fi
            [ -n "$APP_DIR" ] || { echo "VPS_APP_PATH secret fehlt und kein Repo-Pfad gefunden"; exit 1; }
            if [ -z "$SUPA_DIR" ]; then
              if [ -f "/opt/supabase/docker-compose.yml" ]; then SUPA_DIR="/opt/supabase"; else SUPA_DIR="$APP_DIR"; fi
            fi

            echo "==> Pull latest code in $APP_DIR"
            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main

            echo "==> Functions in den Stack kopieren"
            if [ -f "$APP_DIR/infrastructure/supabase/scripts/deploy-functions.sh" ]; then
              STACK_DIR="$SUPA_DIR" bash "$APP_DIR/infrastructure/supabase/scripts/deploy-functions.sh"
            fi

            echo "==> Edge-Functions-Container ermitteln"
            CONTAINER="$(docker ps --format '{{.Names}}\t{{.Image}}' | grep -i 'edge-runtime' | head -n1 | cut -f1)"
            if [ -z "$CONTAINER" ]; then
              CONTAINER="$(docker ps --format '{{.Names}}' | grep -iE 'edge|functions' | head -n1)"
            fi
            [ -n "$CONTAINER" ] || { echo "Kein Edge-Functions-Container gefunden"; docker ps --format '{{.Names}}'; exit 1; }
            echo "Container: $CONTAINER"

            echo "==> Restart $CONTAINER"
            docker restart "$CONTAINER"

            echo "==> Warten bis Container laeuft"
            for i in $(seq 1 20); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ]; then
                echo "$CONTAINER laeuft"
                break
              fi
              sleep 3
            done

            docker logs --tail=30 "$CONTAINER" || true
            echo "==> Deploy finished"
