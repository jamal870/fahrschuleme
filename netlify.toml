# ---------- Apex ↔ www ----------
# KEINE eigene Apex→www-Regel!
# Netlify leitet automatisch auf die als "Primary domain" gesetzte Variante um.
# Eine zusätzliche Regel hier erzeugt eine Redirect-Schleife (Assets laden nicht).
# Gewünschte Variante ausschliesslich in Netlify → Domain management → Primary domain setzen.


# SPA fallback — auch wenn wir HashRouter nutzen,
# sorgt das dafür, dass direkte URL-Aufrufe immer index.html laden
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.stripe.com\"), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https: wss:; frame-src 'self' https://js.stripe.com https://checkout.stripe.com https://www.google.com https://www.youtube.com; worker-src 'self' blob:; upgrade-insecure-requests"

# Cache statische Assets aggressiv
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
